## general ##
include:
  - project: "infra/gitlab-ci-templates"
    ref: main
    file:
      - "/general/build-image-with-kaniko.yml"
      - "/general/k8s-deploy.yml"
      - "/general/scan-with-sonarqube.yml"
      - "/general/notify.yml"
stages:
  - test
  - build-image
  - deploy
  - notify
## Global variables ##
variables:
  RUNNER_TAG: &RUNNER_TAG shared-k8s-runner
  IMAGE_TAG_PREFIX: affiliate
  SERVICE_NAME: wiinvent-ad-website
  ALTERNATIVE_IMAGE_TAG: ${CI_COMMIT_TAG}
  # Tags: dev_YYYY.MM.DD_vN -> build + auto-deploy to dev.
  #       prod_YYYY.MM.DD_vN -> build + notify; prod rollout is done by infra.
  # Each tag builds its own image; SITE_URL is a Dockerfile build arg
  # (default https://ad.wiinvent.tv), PORT is runtime env on the Deployment.
  RELEASE_TAG_RE: &RELEASE_TAG_RE '$CI_COMMIT_TAG =~ /^(dev|prod)_[0-9]{4}\.[0-9]{2}\.[0-9]{2}_v[0-9]+$/'
  DEV_TAG_RE: &DEV_TAG_RE '$CI_COMMIT_TAG =~ /^dev_[0-9]{4}\.[0-9]{2}\.[0-9]{2}_v[0-9]+$/'
  PROD_TAG_RE: &PROD_TAG_RE '$CI_COMMIT_TAG =~ /^prod_[0-9]{4}\.[0-9]{2}\.[0-9]{2}_v[0-9]+$/'
default:
  tags:
    - *RUNNER_TAG

test:
  stage: test
  image: node:22-alpine
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm]
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: *RELEASE_TAG_RE

build-image:
  stage: build-image
  needs: ["test"]
  extends: .build-image-with-kaniko-template
  rules:
    - if: *RELEASE_TAG_RE
  variables:
    DOCKERFILE: Dockerfile

update-image-tag:dev:
  stage: deploy
  needs: ["build-image"]
  extends: .update-k8s-deployment-image-tag
  variables:
    K8S_CLUSTER_NAME: wi-lv-dev
    K8S_NAMESPACE: affiliate-dev
    KUBECONFIG_FILE: /usr/local/k8s/.credentials/${K8S_CLUSTER_NAME}
  rules:
    - if: *DEV_TAG_RE

notify:telegram:
  stage: notify
  needs: ["build-image"]
  extends: .notify-telegram-template
  rules:
    - if: *PROD_TAG_RE
notify:slack:
  stage: notify
  needs: ["build-image"]
  extends: .notify-slack-template
  rules:
    - if: *PROD_TAG_RE
notify:telegram:after-deploy:
  stage: notify
  needs: ["update-image-tag:dev"]
  extends: .notify-telegram-template
  variables:
    NOTIFY_ACTION_MSG: ":white_check_mark: Image deployed!"
  rules:
    - if: *DEV_TAG_RE
notify:slack:after-deploy:
  stage: notify
  needs: ["update-image-tag:dev"]
  extends: .notify-slack-template
  variables:
    NOTIFY_ACTION_MSG: ":white_check_mark: Image deployed!"
  rules:
    - if: *DEV_TAG_RE
